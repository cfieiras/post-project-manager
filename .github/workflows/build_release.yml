name: Build Portable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable with PyInstaller
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver) { $ver = "v1.0.3" }
          $exe_name = "PostProjectManager_$ver"
          Write-Host "Building executable: $exe_name.exe"
          pyinstaller --noconsole --onefile `
            --name "$exe_name" `
            --icon "src/ui/icons/app_icon.ico" `
            --add-data "templates/default_template.json;templates" `
            --add-data "src/ui/icons;src/ui/icons" `
            --clean `
            src/main.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Post Project Manager ${{ github.ref_name }}"
          files: dist/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
